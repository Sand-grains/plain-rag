[project]
name = "plain-rag"
version = "0.3.0"
description = "从零构建的原生 RAG 系统，支持 Agent 编排与多层评估"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [{ name = "Sand_grains" , email = "2298581658@qq.com"}]

dependencies = [
    "numpy>=2.0",
    "sentence-transformers>=5.0",
    "openai>=2.0",
    "python-dotenv>=1.0",
    "hello-agents>=0.2",
    "rank-bm25>=0.2",
    "jieba>=0.42",
    "redis>=5.0",
    "elasticsearch>=8.14,<9.0",
    "psycopg2-binary>=2.9.12",
    "pymilvus>=3.0.1",
    "PyYAML>=6.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-languages>=1.10.2",
    "scipy>=1.17.1",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
# NVIDIA GPU:  pip install -e ".[cuda]" --index-url https://download.pytorch.org/whl/cu128
# CPU only:   pip install -e ".[cpu]" --index-url https://download.pytorch.org/whl/cpu
cuda = ["torch", "torchvision"]
cpu = ["torch", "torchvision"]
# 012 heavy 解析链(parse_backends 重型后端; 版本冻结, 升级触发重标见 012 条例五)
parse-heavy = [
    "docling==2.123.1",
    "mineru==3.4.5",
    "markitdown==0.1.7",
    "pymupdf==1.28.2",
    "trafilatura==2.2.0",
]

[tool.setuptools.packages.find]
include = ["indexing*", "retrieval*", "agent*", "preprocess*", "harness*", "obs*", "eval*", "infra*"]

[tool.pytest.ini_options]
testpaths = ["tests", "harness/tests"]
addopts = "-ra --strict-markers -m \"not external and not slow\" --durations=5"
markers = [
  "unit: 纯函数/模块级",
  "integration: 模块间/双后端",
  "regression: 回归迁移",
  "external: 真连 PgSQL+ES+Milvus",
  "slow: 慢",
]

[tool.coverage.run]
source = ["config", "indexing", "retrieval", "preprocess", "eval", "infra", "agent", "harness", "obs"]
branch = true
omit = ["obs/monitor_panel.py"]

[tool.coverage.report]
exclude_lines = ["except Exception", "pass"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
